<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS 90 ngày – Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#FFF8F3;--card:#fff;--card2:#FBF8FF;--tx:#3B3552;--mu:#7C7596;--bd:#EFE7F7;--trk:#0000000f;
--pk:#FFE1EC;--pkA:#F27BA6;--pe:#FFE6D5;--peA:#FF9A62;--le:#FFF4C9;--leA:#F2BE1F;--mi:#D9F6E6;--miA:#3CC38A;--sk:#DCEFFF;--skA:#4BA3F2;--la:#E8E2FF;--laA:#8A74F0;--nu:#F1EEF7;--nuA:#9a93b5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16151f;--card:#201f2c;--card2:#272636;--tx:#EDEAF8;--mu:#A39FBD;--bd:#34324a;--trk:#ffffff1a;--pk:#3d2733;--pe:#3d2f27;--le:#3a3623;--mi:#233a30;--sk:#233447;--la:#2f2a4a;--nu:#2b2a38}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16151f;--card:#201f2c;--card2:#272636;--tx:#EDEAF8;--mu:#A39FBD;--bd:#34324a;--trk:#ffffff1a;--pk:#3d2733;--pe:#3d2f27;--le:#3a3623;--mi:#233a30;--sk:#233447;--la:#2f2a4a;--nu:#2b2a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:600 15px/1.55 Nunito,system-ui,'Segoe UI',Roboto,sans-serif;background:radial-gradient(700px 320px at 0 0,var(--la),transparent),radial-gradient(600px 320px at 100% 0,var(--pk),transparent),var(--bg)}
.w{max-width:1120px;margin:auto;padding:16px}
.c-pk{--b:var(--pk);--a:var(--pkA)}.c-pe{--b:var(--pe);--a:var(--peA)}.c-le{--b:var(--le);--a:var(--leA)}.c-mi{--b:var(--mi);--a:var(--miA)}.c-sk{--b:var(--sk);--a:var(--skA)}.c-la{--b:var(--la);--a:var(--laA)}.c-nu{--b:var(--nu);--a:var(--nuA)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--bd)}
.card[class*=" c-"]{background:var(--b)}
h1,h2,h3,h4{margin:0 0 6px;line-height:1.25}h1{font-size:24px;font-weight:900}h2{font-size:20px;font-weight:900;margin:22px 0 10px}h3{font-size:18px;font-weight:800}h4{font-size:15px}
small{color:var(--mu);font-weight:700}.mu{color:var(--mu);margin:2px 0 8px}
.brand{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--laA);margin:4px 4px 10px}
#prof{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.av{width:78px;height:78px;border-radius:26px;border:3px solid var(--laA);background:var(--la);font-size:42px;cursor:pointer}
.pm{display:grid;gap:8px}.pg{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pg label{font-size:12.5px;color:var(--mu);font-weight:800;display:grid;gap:3px}
input:not([type=checkbox]),select,textarea{width:100%;border:2px solid var(--bd);background:var(--card2);color:var(--tx);border-radius:14px;padding:8px 12px;font:inherit;font-weight:700}
input:focus,select:focus,textarea:focus{outline:3px solid var(--la);border-color:var(--laA)}
textarea{min-height:90px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:16px 0}
.stats .r{display:flex;align-items:center;gap:12px}
.bar{height:10px;border-radius:9px;background:var(--trk);position:relative;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--a,var(--laA));border-radius:9px;transition:width .5s}
.bar u{position:absolute;top:0;bottom:0;width:3px;background:var(--tx)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tab,.mini,.nb{border:2px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 16px;font:inherit;font-weight:800;color:var(--tx);cursor:pointer}
.tab.on{background:var(--laA);border-color:var(--laA);color:#fff}.mini{padding:4px 12px;font-size:13px;background:var(--card)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pct{font-size:22px;font-weight:900}
.skl{display:grid;gap:8px}.sk{display:grid;grid-template-columns:150px 1fr 56px;align-items:center;gap:10px;background:var(--b);padding:6px 14px;border-radius:14px}.sk em{font-style:normal;text-align:right;color:var(--mu);font-size:13px}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.wc{text-align:left;background:var(--b);border:3px solid transparent;border-radius:20px;padding:14px;cursor:pointer;color:var(--tx);font:inherit;box-shadow:0 5px 0 var(--bd);transition:transform .15s}
.wc:hover{transform:translateY(-3px)}.wc.now{border-color:var(--a)}.wc.done{box-shadow:0 5px 0 var(--a)}
.wc p{margin:6px 0 4px;font-size:13.5px;min-height:40px}.wh,.wf{display:flex;justify-content:space-between;gap:8px;align-items:center}.wh span,.wf span{color:var(--mu);font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{position:relative;isolation:isolate;overflow:hidden;width:42px;height:42px;border-radius:14px;border:2px solid var(--a);background:var(--card);font:900 15px Nunito,sans-serif;color:var(--tx);cursor:pointer}
.chip i{position:absolute;left:0;right:0;bottom:0;background:var(--b);z-index:-1}.chip.on{background:var(--a);color:#fff}
.gt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.gt div{background:var(--card2);border-radius:16px;padding:10px 14px;white-space:pre-line}.gt h4{margin-bottom:4px}
.sec{background:var(--card);border:2px solid var(--b);border-radius:22px;margin:14px 0;overflow:hidden;box-shadow:0 5px 0 var(--b)}
.sh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--b);padding:12px 16px}.sh b{font-size:18px;font-weight:900}.sh small{display:block}
.sp{flex:1;min-width:150px;display:flex;align-items:center;gap:8px}.sp .bar{flex:1}.sp span{font-size:13px;color:var(--mu)}
.sb{display:grid;grid-template-columns:1.25fr 1fr}.sb ul{list-style:none;margin:0;padding:10px 16px}
.sb aside{padding:12px 16px;background:var(--card2);border-left:2px dashed var(--bd)}
li label{display:flex;gap:10px;padding:7px 0;cursor:pointer;align-items:flex-start;position:relative}
li input{position:absolute;opacity:0}
.bx{flex:none;width:22px;height:22px;border-radius:8px;border:2px solid var(--a);margin-top:2px;display:grid;place-items:center}
li input:checked+.bx{background:var(--a)}li input:checked+.bx::after{content:'✓';color:#fff;font-size:14px;font-weight:900}
li input:focus-visible+.bx{outline:3px solid var(--la)}
li.on span:last-child{color:var(--mu);text-decoration:line-through}
.tx{white-space:pre-line;font-size:13.5px}h5{margin:8px 0 4px;font-size:13px}a{color:var(--skA);font-weight:800;word-break:break-all}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:8px 10px;border-bottom:2px solid var(--bd);text-align:left;vertical-align:top}td input{width:78px;padding:5px 8px}.ov{font-weight:900;font-size:17px;color:var(--laA)}
.svg{width:100%;height:auto}.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:4px 0 12px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px}
.pn{display:flex;justify-content:space-between;margin:16px 0}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--laA);color:#fff;padding:12px 20px;border-radius:99px;font-weight:900;transition:.3s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mu);font-size:12.5px;margin:30px 0 10px}
@media(max-width:760px){.sb{grid-template-columns:1fr}.sb aside{border-left:0;border-top:2px dashed var(--bd)}.gt{grid-template-columns:1fr}.sk{grid-template-columns:1fr 1fr 50px}}
</style>
</head>

úc bài thi và 4 tiêu chí chấm; đo trình độ đầu vào (Ngày 7); chuẩn bị dụng cụ học (sổ từ vựng giấy, vở bài tập, bút đỏ, thư mục ghi âm); ôn chắc ngữ pháp nền.","target":"• Hoàn thành bài chẩn đoán 4 kỹ năng, ghi baseline vào Tracker\n• Học ~120 từ Education (6 nhóm), chép đủ vào sổ từ vựng giấy\n• Hiểu 4 tiêu chí chấm Writing và Speaking (Phụ lục D)\n• 100% bài làm trong tuần được chấm và sửa bằng bút đỏ ngay trên bài","hdr":["Kỹ năng","Chủ đề (Education) - Checklist","Link tài liệu","Ghi chú"],"sections":[{"skill":"Từ vựng\n~3h30'","start":7,"end":14,"links":"• IELTS Liz – Vocabulary (tra chủ đề Education): ieltsliz.com/vocabulary/\n• Oxford Learner's Dictionaries (tra collocation)\n• Cambridge Dictionary","notes":"• Collocation: pursue a degree, gain qualifications, tackle illiteracy, broaden one's horizons\n• Paraphrase mẫu: pupils ↔ students/learners; drop out ↔ leave school early\n• Đầu ra: +~120 từ trong sổ; bảng ý tưởng cho 3 đề\n• Ôn sổ theo chu kỳ 1-3-7-14 ngày","items":[{"text":"Học 6 nhóm từ (~120 từ), mỗi ngày 1 nhóm (35'): nghĩa + collocation + 1 câu ví dụ vào sổ giấy","done0":false},{"text":"Nhóm 1 – Trường học & chương trình: curriculum, compulsory education, literacy, numeracy, extracurricular activities, peer pressure, rote learning","done0":false},{"text":"Nhóm 2 – Đại học: undergraduate, postgraduate, scholarship, tuition fees, student debt, enrol, drop out","done0":false},{"text":"Nhóm 3 – Học online: distance learning, virtual classroom, self-paced, digital literacy, attention span, blended learning","done0":false},{"text":"Nhóm 4 – Phương pháp dạy – học: student-centred, hands-on learning, personalised learning, class size, critical thinking, lifelong learning","done0":false},{"text":"Nhóm 5 – Kỹ năng & nghề nghiệp: vocational training, apprenticeship, soft skills, employability, skills gap, STEM subjects","done0":false},{"text":"Nhóm 6 – Chính sách & công bằng: free education, equal opportunities, state vs private school, home-schooling, curriculum reform","done0":false},{"text":"Lập bảng ý tưởng (3 lợi ích – 3 hạn chế – 3 giải pháp) cho 3 đề: free university, online learning, bắt đầu đi học sớm","done0":false}]},{"skill":"Ngữ pháp\n~3h","start":15,"end":20,"links":"• Sách ngữ pháp đang dùng (VD: Cambridge Grammar for IELTS, English Grammar in Use)","notes":"• Đầu ra: điểm từng bài tập; câu sai đã sửa bút đỏ\n• Đầu ra: 10 câu về bản thân + 8 câu dự đoán","items":[{"text":"Tenses 1 (present/past simple & continuous)","done0":false},{"text":"Present perfect vs past simple (just/already/yet/for/since/ago): viết 10 câu về bản thân, học tập","done0":false},{"text":"Past perfect và các dạng tương lai: viết 8 câu dự đoán xu hướng giáo dục","done0":false},{"text":"Hòa hợp chủ ngữ – động từ; danh từ đếm được/không đếm được (information, advice, research…)","done0":false},{"text":"Mạo từ a/an/the/zero: 5 quy tắc cốt lõi, 25 câu điền mạo từ","done0":false},{"text":"Câu đơn – ghép – phức: sửa run-on, comma splice; viết lại 10 câu đơn thành câu phức","done0":false}]},{"skill":"Reading\n~3h30'","start":21,"end":24,"links":"• Cambridge IELTS 16 – Test 2, Passage 1\n• Cambridge IELTS 17 – Test 4, Passage 2: “Does education fuel economic growth?”\n• Cambridge IELTS 18 – Test 4, Passage 2: “The growth mindset”\n• Đọc thêm (tùy chọn): IZONE – IELTS Recent Actual Test: “Does An IQ Test Prove Creativity?”\n• Danh mục bài IZONE: izone.edu.vn/series/giai-de-thi-that-ielts-reading-2/","notes":"• Kỹ thuật: skimming (title, heading, câu đầu mỗi đoạn – 3') và scanning keyword\n• Kỹ thuật: True/False/Not Given (False = ngược lại; Not Given = không đủ thông tin)\n• Kỹ thuật: Matching Headings (đọc hết heading trước, tìm main idea, loại heading thừa)\n• Đầu ra: số câu đúng + thời gian mỗi passage; 10 từ học thuật vào sổ","items":[{"text":"Khởi động kỹ thuật: Cam 16 T2 P1 (20' làm + 15' phân tích)","done0":false},{"text":"Passage 1 (Education): Cam 17 T4 P2 – 20' làm, 25' phân tích (gạch câu chứa đáp án, ghi paraphrase)","done0":false function stats(){const[d,t]=all(),p=pc(d,t),dn=dayNo(),e=exp(),ex=S.p.exam?Math.round((new Date(S.p.exam+'T00:00')-today())/864e5):null;
const day=dn==null?'Chưa đặt ngày bắt đầu':dn<1?`Bắt đầu sau ${1-dn} ngày`:dn>90?'Đã hết 90 ngày':`Ngày ${dn}/90 · Tuần ${Math.ceil(dn/7)}`;
const cd=ex==null?'Chưa đặt ngày thi':ex>0?`Còn ${ex} ngày đến kỳ thi`:ex==0?'Hôm nay thi — cố lên! 💪':'Kỳ thi đã qua';
let b=['Chưa vào kế hoạch','nu','🗓️'];if(e!=null&&dn>=1){const g=p-e;b=g>.03?['Vượt tiến độ','mi','🚀']:g<-.05?['Đang chậm','pk','🐢']:['Đúng tiến độ','sk','✅']}
let last=null;W.forEach((_,i)=>{const o=ov(S.sc[i]);if(o!=null)last=o});
$('stats').innerHTML=`<div class="card c-la r">${ring(p,104)}<div><h3>Tổng tiến độ</h3><p class="mu">${d}/${t} mục đã xong</p></div></div>
<div class="card c-sk"><small>📆 Lịch học</small><h3>${day}</h3><p class="mu">${cd}</p></div>
<div class="card c-${b[1]}"><small>${b[2]} So với kế hoạch</small><h3>${b[0]}</h3>${bar(p,e!=null?`<u style="left:${e*100}%"></u>`:'')}<p class="mu" style="margin:0">Thực tế ${Math.round(p*100)}%${e!=null?` · Kỳ vọng ${Math.round(e*100)}%`:''}</p></div>
<div class="card c-pe"><small>🔥 Chuỗi ngày học</small><h3>${streak()} ngày liên tiếp</h3><p class="mu">Điểm gần nhất: ${last??'—'} / mục tiêu ${S.p.goal}</p></div>`}
function vOv(){const ph3=[0,1,2].map(i=>{const ws=W.map((_,j)=>j).filter(j=>ph(j)==i);let a=0,b=0;ws.forEach(j=>{const c=cnt(j);a+=c[0];b+=c[1]});const n=OV[ws[0]].phase.split(' - ');return `<div class="card c-${PC[i]}"><small>${E(n[0])}</small><h3>${E(n[1])}</h3><p class="mu">Tuần ${ws[0]+1} – ${ws[ws.length-1]+1} · ${a}/${b} mục</p>${bar(pc(a,b))}<span class="pct">${Math.round(pc(a,b)*100)}%</span></div>`}).join('');
const sk=KN.map((n,k)=>{let a=0,b=0;W.forEach((w,i)=>w.sections.forEach((s,j)=>{if(kix(s.skill)==k){const c=cnt(i,j);a+=c[0];b+=c[1]}}));return `<div class="sk c-${KC[k]}"><b>${n}</b>${bar(pc(a,b))}<em>${a}/${b}</em></div>`}).join('');
const wk=W.map((w,i)=>{const c=cnt(i),p=pc(...c);return `<button class="wc c-${PC[ph(i)]}${inPlan()&&i==curW()?' now':''}${p==1?' done':''}" onclick="go('wk',${i})"><div class="wh"><b>${E(OV[i].week)}</b><span>Ngày ${E(OV[i].days)}</span></div><p>${E(OV[i].topic)}</p>${bar(p)}<div class="wf"><span>${c[0]}/${c[1]} mục${p==1?' ✔':''}</span><b>${Math.round(p*100)}%</b></div></button>`}).join('');
return `<h2>🧭 3 giai đoạn</h2><div class="g3">${ph3}</div><h2>💪 Tiến độ theo kỹ năng</h2><div class="skl">${sk}</div><h2>🗺️ Bản đồ 13 tuần</h2><div class="wg">${wk}</div>`}
function vWk(){const i=cw,w=W[i],c=cnt(i),p=pc(...c),cl=PC[ph(i)];
const chips=W.map((_,j)=>`<button class="chip c-${PC[ph(j)]}${j==i?' on':''}" onclick="go('wk',${j})">${j+1}<i style="height:${pc(...cnt(j))*100}%"></i></button>`).join('');
const secs=w.sections.map((s,si)=>{const q=cnt(i,si),n=s.skill.split('\n'),open=q[0]<q[1];return `<section class="sec c-${KC[kix(s.skill)]}"><div class="sh"><div><b>${E(n[0])}</b><small>${E(n.slice(1).join(' '))}</small></div><div class="sp">${bar(pc(...q))}<span>${q[0]}/${q[1]}</span></div><button class="mini" onclick="al(${i},${si},${open})">${open?'✓ Tick hết':'Bỏ tick'}</button></div><div class="sb"><ul>${s.items.map((it,ii)=>{const on=S.c[i+'.'+si+'.'+ii];return `<li class="${on?'on':''}"><label><input type="checkbox" ${on?'checked':''} onchange="tg(${i},${si},${ii},this.checked)"><span class="bx"></span><span>${E(it.text)}</span></label></li>`}).join('')}</ul><aside><h5>🔗 ${E(w.hdr[2])} (của bạn)</h5><textarea placeholder="Dán link hoặc ghi chú tài liệu bạn dùng…" oninput="lk(${i},${si},this.value)" onchange="lk(${i},${si},this.value,1)">${E(S.lk[i+'.'+si]||'')}</textarea><div class="tx" id="lp${i}_${si}">${LK(S.lk[i+'.'+si]||'')}</div><h5>📝 ${E(w.hdr[3])}</h5><div class="tx">${LK(s.notes||'—')}</div></aside></div></section>`}).join('');
return `<div class="chips">${chips}</div><div class="card c-${cl}"><small>${E(w.sub)}</small><h2 style="margin:4px 0 8px">${E(w.title)}</h2><div class="sp">${bar(p)}<b>${Math.round(p*100)}%</b><span>${c[0]}/${c[1]}</span></div><div class="gt"><div><h4>🎯 Mục tiêu tuần</h4>${E(w.goal)}</div><div><h4>📌 Chỉ tiêu cần đạt</h4>${E(w.target)}</div></div></div>${secs}<div class="card"><h4>✍️ Nhật ký tuần ${i+1}</h4><textarea placeholder="Ghi lại điều đã học, lỗi hay gặp, cảm nhận của bạn…" oninput="S.n[${i}]=this.value;sv()">${E(S.n[i]||'')}</textarea></div><div class="pn"><button class="nb" ${i?'':'disabled'} onclick="go('wk',${i-1})">← Tuần trước</button><button class="nb" ${i<12?'':'disabled'} onclick="go('wk',${i+1})">Tuần sau →</button></div>`}
function chart(){const X=i=>40+i*(580/12),Y=v=>170-(v-3)*25,g=parseFloat(S.p.goal);let s='<svg viewBox="0 0 640 200" class="svg">';
for(let v=3;v<=9;v++)s+=`<line x1="40" x2="620" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="30" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--mu)">${v}</text>`;
for(let i=0;i<13;i++)s+=`<text x="${X(i)}" y="192" font-size="10" text-anchor="middle" fill="var(--mu)">T${i+1}</text>`;
if(g>=3)s+=`<line x1="40" x2="620" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--miA)" stroke-dasharray="6 5" stroke-width="2"/><text x="620" y="${Y(g)-5}" font-size="11" text-anchor="end" fill="var(--miA)">Mục tiêu ${S.p.goal}</text>`;
const L=[['L','var(--skA)'],['R','var(--peA)'],['W','var(--pkA)'],['S','var(--leA)'],['O','var(--laA)']];
L.forEach(([k,col])=>{const pts=[];W.forEach((_,i)=>{const r=S.sc[i]||{},v=k=='O'?ov(r):parseFloat(r[k]);if(v!=null&&!isNaN(v))pts.push([X(i),Y(v)])});
if(pts.length>1)s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${k=='O'?4:2}" stroke-linecap="round" stroke-linejoin="round" opacity="${k=='O'?1:.8}"/>`;
pts.forEach(q=>s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${k=='O'?5:3}" fill="${col}"/>`)});
return s+`</svg><div class="lg">${L.map(([k,c])=>`<span><i style="background:${c}"></i>${k=='O'?'Overall':k}</span>`).join('')}</div>`}
function vSc(){return `<div class="card"><h3>📈 Bảng điểm theo tuần</h3><p class="mu">Nhập band (0–9, bước 0.5) từ bài test/mock cuối tuần. Overall tự tính = trung bình 4 kỹ năng, làm tròn 0.5. Tuần 1 (Ngày 7) là điểm baseline.</p><div id="ch">${chart()}</div><div class="tw"><table><thead><tr><th>Tuần</th><th>Bài đánh giá</th><th>L</th><th>R</th><th>W</th><th>S</th><th>Overall</th></tr></thead><tbody>${W.map((w,i)=>{const r=S.sc[i]||{};return `<tr><td><b>${i+1}</b></td><td>${E(w.sections[w.sections.length-1].skill.split('\n')[0])}</td>${['L','R','W','S'].map(k=>`<td><input type="number" min="0" max="9" step="0.5" value="${E(r[k]??'')}" oninput="ss(${i},'${k}',this.value)"></td>`).join('')}<td id="o${i}" class="ov">${ov(r)??'—'}</td></tr>`}).join('')}</tbody></table></div></div>`}
function vSrc(){const s=D.sources;return `<div class="card"><h3>🔗 ${E(s.title)}</h3><p class="mu">${E(s.note)}</p><div class="tw"><table><thead><tr><th>Nguồn</th><th>Dùng cho</th><th>Địa chỉ</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td><b>${E(r.name)}</b></td><td>${E(r.use)}</td><td>${LK(r.url)}</td></tr>`).join('')}</tbody></table></div></div>`}
const TB=[['ov','🏠 Tổng quan'],['wk','📚 Chi tiết tuần'],['sc','📈 Điểm số'],['src','🔗 Nguồn học']];
function view(){$('tabs').innerHTML=TB.map(([k,l])=>`<button class="tab${k==cur?' on':''}" onclick="go('${k}')">${l}</button>`).join('');$('view').innerHTML=({ov:vOv,wk:vWk,sc:vSc,src:vSrc})[cur]()}
function go(v,w){cur=v;if(w!=null)cw=w;view();if(w!=null)scrollTo({top:$('tabs').offsetTop-8,behavior:'smooth'})}
cw=inPlan()?curW():0;prof();stats();view();
(async()=>{try{if(!window.claude)return;const[db,us]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!us)return;const id=await us.id();if(!id)return;dbDoc=db.collection('data/users/'+id).doc('ielts');const sn=await dbDoc.get(),r=sn.exists?JSON.parse(sn.data().json):null;if(r&&(r.ts||0)>S.ts){S=mg(r);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}prof();stats();view()}else if(S.ts)push()}catch(e){}})();
</script>
</body>
</html>
